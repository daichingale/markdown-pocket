[package]
name = "markdown-pocket"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_commonmark = "0.18"
rfd = "0.15"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
